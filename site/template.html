<title>Casting Weekly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Archivo:wght@800&display=swap">
<style>
/* Layout: a sticky console bar (brand, sections, search) over one view at a time. The network view fills the
   screen as a three-pane console; every other view is a 1180px column of tables and evidence cards. */
:root{
  --bg:#07090D; --bg2:#0C1016; --panel:#0F141B; --panel2:#141B24; --line:#1D2630; --line2:#2A3542;
  --text:#D8DFE8; --dim:#8693A3; --faint:#5E6B7C;
  --amber:#F5B83D; --cyan:#5CC8FF; --violet:#A99BFF; --person:#C9D3DF; --ok:#5DD39E; --warn:#F2915F;
  --amber-soft:rgba(245,184,61,.14); --cyan-soft:rgba(92,200,255,.12); --violet-soft:rgba(169,155,255,.13); --ok-soft:rgba(93,211,158,.12); --warn-soft:rgba(242,145,95,.13);
  --l-cd:rgba(245,184,61,.36); --l-venue:rgba(169,155,255,.26); --l-credit:rgba(201,211,223,.17); --grid:rgba(42,53,66,.55);
  --on-accent:#121317; --shadow:0 20px 50px rgba(0,0,0,.55);
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --display:Archivo,"IBM Plex Sans",system-ui,sans-serif;
  --hdr:56px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F5F7FA; --bg2:#ECF0F5; --panel:#FFFFFF; --panel2:#F1F4F8; --line:#DCE2EA; --line2:#C5CFDB;
  --text:#111821; --dim:#4B5869; --faint:#748194;
  --amber:#A86A00; --cyan:#0A73A8; --violet:#5F49D2; --person:#56657A; --ok:#17855A; --warn:#B9501D;
  --amber-soft:rgba(168,106,0,.10); --cyan-soft:rgba(10,115,168,.09); --violet-soft:rgba(95,73,210,.09); --ok-soft:rgba(23,133,90,.10); --warn-soft:rgba(185,80,29,.10);
  --l-cd:rgba(168,106,0,.42); --l-venue:rgba(95,73,210,.30); --l-credit:rgba(86,101,122,.22); --grid:rgba(197,207,219,.55);
  --on-accent:#FFFFFF; --shadow:0 18px 40px rgba(17,24,33,.14);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#F5F7FA; --bg2:#ECF0F5; --panel:#FFFFFF; --panel2:#F1F4F8; --line:#DCE2EA; --line2:#C5CFDB;
  --text:#111821; --dim:#4B5869; --faint:#748194;
  --amber:#A86A00; --cyan:#0A73A8; --violet:#5F49D2; --person:#56657A; --ok:#17855A; --warn:#B9501D;
  --amber-soft:rgba(168,106,0,.10); --cyan-soft:rgba(10,115,168,.09); --violet-soft:rgba(95,73,210,.09); --ok-soft:rgba(23,133,90,.10); --warn-soft:rgba(185,80,29,.10);
  --l-cd:rgba(168,106,0,.42); --l-venue:rgba(95,73,210,.30); --l-credit:rgba(86,101,122,.22); --grid:rgba(197,207,219,.55);
  --on-accent:#FFFFFF; --shadow:0 18px 40px rgba(17,24,33,.14);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--sans)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg2)}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg2);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:18px;min-height:var(--hdr)}
.brand{display:flex;align-items:baseline;gap:9px;white-space:nowrap;text-decoration:none}
.brand b{font:800 17px var(--display);letter-spacing:-.01em}
.brand span{font:500 10.5px var(--mono);letter-spacing:.18em;color:var(--amber)}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:6px 10px;border-radius:6px;color:var(--dim);text-decoration:none;font-weight:500;white-space:nowrap}
.nav a:hover{color:var(--text)}
.nav a[aria-current="page"]{color:var(--text);background:var(--panel2);box-shadow:inset 0 -2px 0 var(--amber)}
.cmd{position:relative;margin-left:auto;width:min(300px,100%)}
.cmd input{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:7px 34px 7px 32px;font:13px var(--mono)}
.cmd input::placeholder{color:var(--faint)}
.cmd svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);stroke:var(--dim)}
.cmd kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:11px var(--mono);color:var(--faint);border:1px solid var(--line2);border-radius:4px;padding:0 5px}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line2);border-radius:8px;overflow:hidden;z-index:40;box-shadow:var(--shadow)}
.sugg a{display:flex;gap:10px;align-items:center;padding:9px 12px;text-decoration:none}
.sugg a[aria-selected="true"],.sugg a:hover{background:var(--panel2)}
.sugg small{margin-left:auto;font:11px var(--mono);color:var(--faint);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
@media (max-width:900px){
  .top-in{flex-wrap:wrap;gap:8px 14px;padding-block:8px}
  .cmd{width:auto;flex:1;min-width:160px}
  .nav{order:3;width:100%}
}

/* pages */
.page{max-width:1180px;margin:0 auto;padding-block:28px 72px;display:flex;flex-direction:column;gap:28px}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 20px;justify-content:space-between}
.ph h1{font:600 26px/1.15 var(--sans);letter-spacing:-.015em;margin:0;text-wrap:balance}
.ph p{margin:6px 0 0;color:var(--dim);max-width:68ch}
.crumb{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}
.crumb a{color:var(--faint);text-decoration:none}.crumb a:hover{color:var(--text)}
.stamp{font:11px var(--mono);letter-spacing:.1em;color:var(--faint);text-transform:uppercase;white-space:nowrap}
.lbl{font:500 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:0}
h2.sec{font:600 15px var(--sans);margin:0}
.muted{color:var(--dim)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.cols.wide-left{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:860px){.cols,.cols.wide-left{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.more{font:500 12px var(--mono);color:var(--cyan);text-decoration:none;letter-spacing:.04em}
.more:hover{text-decoration:underline}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font:600 30px/1.1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .k-l{font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.kpi .k-s{font-size:12.5px;color:var(--faint);margin-top:6px}
.kpi.cd b{color:var(--amber)}.kpi.prod b{color:var(--cyan)}
.bars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.bars li{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 26px;gap:12px;align-items:center}
.bars .bar{height:8px;border-radius:2px;background:var(--panel2);overflow:hidden}
.bars .bar i{display:block;height:100%;background:var(--amber);border-radius:2px}
.bars b{font:600 13px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.att{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.att li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.att li:last-child{border-bottom:0}
.att .n{font:600 18px/1.2 var(--mono);min-width:30px;font-variant-numeric:tabular-nums}
.att .n.warn{color:var(--warn)}.att .n.ok{color:var(--ok)}
.att p{margin:0}.att small{color:var(--faint)}
.queue{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.queue li{font-size:12.5px;padding:3px 8px;border:1px dashed var(--line2);border-radius:4px;color:var(--dim)}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.card .tbl{border:0;border-radius:0;background:none;margin:0 -20px -18px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel2);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--panel2)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td .sub{display:block;font-size:12px;color:var(--faint)}
.lnk{text-decoration:none;font-weight:500}
.lnk:hover{text-decoration:underline}
.lnk.cd{color:var(--amber)}
.list-inline{display:flex;flex-wrap:wrap;gap:2px 10px}
.empty{padding:28px;text-align:center;color:var(--dim)}

/* chips, pills, filters */
.pill{display:inline-block;font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:3px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
.pill.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.pill.cd{color:var(--amber);border-color:var(--amber);background:var(--amber-soft)}
.pill.prod{color:var(--cyan);border-color:var(--cyan);background:var(--cyan-soft)}
.pill.venue{color:var(--violet);border-color:var(--violet);background:var(--violet-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.filters{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13px;color:var(--dim)}
.seg button[aria-pressed="true"]{color:var(--text);border-color:var(--amber);background:var(--amber-soft)}
.seg button small{font:11px var(--mono);color:var(--faint);margin-left:6px}
.filters input[type="search"]{background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:6px 10px;min-width:0;width:220px;max-width:100%}
.check{display:flex;gap:8px;align-items:center;color:var(--dim);font-size:13px;cursor:pointer}
.check input{accent-color:var(--amber)}
.count{font:12px var(--mono);color:var(--faint);margin-left:auto}

/* profile */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.stats div{padding:12px 16px;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0}
.stats b{display:block;font:600 22px var(--mono);font-variant-numeric:tabular-nums}
.stats span{font:10.5px var(--mono);letter-spacing:.12em;color:var(--faint);text-transform:uppercase}
.assoc{display:flex;flex-wrap:wrap;gap:6px}
.assoc a{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:4px 9px;text-decoration:none;font-size:13px}
.assoc a:hover{border-color:var(--line2)}
.assoc a.cd{border-color:var(--amber);color:var(--amber)}
.assoc small{font:11px var(--mono);color:var(--faint);margin-left:4px}
.creds{display:flex;flex-direction:column;gap:10px}
.cred{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cred-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.role{font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.role.cd{color:var(--amber)}
.ev{margin:0;font:12.5px/1.6 var(--mono);color:var(--dim);background:var(--bg);border:1px solid var(--line);border-left:2px solid var(--amber);border-radius:4px;padding:8px 11px;overflow-wrap:anywhere}
.prov{display:flex;flex-wrap:wrap;gap:4px 14px;font:11.5px var(--mono);color:var(--faint)}
.prov a{color:var(--cyan);text-decoration:none;overflow-wrap:anywhere}
.prov a:hover{text-decoration:underline}
.note{border:1px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:12px 14px;color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:7px 12px;text-decoration:none;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--amber)}
.prose{max-width:68ch;display:flex;flex-direction:column;gap:14px}
.prose p{margin:0}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.steps li::marker{font:600 13px var(--mono);color:var(--amber)}
.legend{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px}
@media (max-width:600px){.legend{grid-template-columns:minmax(0,1fr)}}
.legend li{display:flex;gap:10px;align-items:baseline}

/* network console */
.net{display:grid;grid-template-columns:264px minmax(0,1fr) 360px;height:calc(100vh - var(--hdr) - env(safe-area-inset-top,0px));height:calc(100dvh - var(--hdr) - env(safe-area-inset-top,0px))}
.rail{border-right:1px solid var(--line);background:var(--bg2);overflow:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px}
.rail .lbl{margin-top:8px}
.toggles{display:flex;flex-direction:column;gap:6px}
.tg{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer;text-align:left;min-width:0}
.tg[aria-pressed="false"]{opacity:.45}
.tg .sw{width:10px;height:10px;border-radius:50%;flex:none}
.tg .sq{border-radius:2px;transform:rotate(45deg)}
.tg small{margin-left:auto;font:11px var(--mono);color:var(--dim)}
.chain{gap:0}
.chain .row{display:flex;align-items:stretch;gap:6px;position:relative;padding-bottom:12px}
.chain .row:last-child{padding-bottom:0}
.chain .row:not(:last-child)::after{content:"";position:absolute;left:44px;bottom:1px;height:10px;border-left:1px dashed var(--line2)}
.chain .tg{flex:1}
.grip{width:26px;flex:none;display:grid;place-items:center;background:none;border:1px solid var(--line);border-radius:6px;color:var(--faint);cursor:grab;touch-action:none;font:14px var(--mono)}
.grip:hover{color:var(--text);border-color:var(--line2)}
.row.dragging{opacity:.6}
.hint{font:11px/1.45 var(--mono);color:var(--faint);margin:0}
.index{display:flex;flex-direction:column}
.index button{display:flex;gap:8px;align-items:center;background:none;border:0;border-bottom:1px solid var(--line);padding:7px 2px;text-align:left;cursor:pointer}
.index button:hover{color:var(--amber)}
.index small{margin-left:auto;font:11px var(--mono);color:var(--faint)}
.stage{position:relative;overflow:hidden;background:
  linear-gradient(var(--grid) 1px, transparent 1px) 0 0/48px 48px,
  linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/48px 48px, var(--bg)}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;left:14px;top:12px;font:11px var(--mono);letter-spacing:.1em;color:var(--faint);pointer-events:none;z-index:2;text-transform:uppercase}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px;z-index:2}
.zoom button{width:30px;height:30px;background:var(--panel);border:1px solid var(--line2);border-radius:5px;cursor:pointer;font:14px var(--mono)}
.centre-pick{display:none;position:absolute;left:12px;bottom:12px;z-index:2;font:12px var(--mono);color:var(--dim);background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;gap:6px;align-items:center}
.centre-pick select{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 6px}
.node-label{font:500 11px var(--mono);fill:var(--text);paint-order:stroke;stroke:var(--bg);stroke-width:3px;pointer-events:none}
.node-label.prod{fill:var(--cyan);font-size:10.5px}
.node-label.hub{font:600 13px var(--sans);stroke-width:4px}
line.l-cd{stroke:var(--l-cd)} line.l-venue{stroke:var(--l-venue);stroke-dasharray:3 4} line.l-credit{stroke:var(--l-credit)}
.ring-text{font:500 11px var(--mono);letter-spacing:.14em;fill:var(--faint)}
.dossier{border-left:1px solid var(--line);background:var(--bg2);overflow:auto}
.d-empty{padding:26px 22px;color:var(--dim);display:flex;flex-direction:column;gap:10px}
.d-empty h2{font:600 15px var(--sans);color:var(--text);margin:0}
.d-empty p{margin:0}
.d-head{padding:20px 22px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.d-head h2{font:600 22px/1.15 var(--sans);letter-spacing:-.01em;margin:0}
.d-sec{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.d-sec .cred{background:var(--panel)}
@media (max-width:1100px){.net{grid-template-columns:0 minmax(0,1fr) 330px}.rail{display:none}.centre-pick{display:flex}}
@media (max-width:760px){
  .net{display:flex;flex-direction:column;height:auto}
  .stage{height:62vh;min-height:340px}
  .dossier{border-left:0;border-top:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<header class="top">
  <div class="top-in gut">
    <a class="brand" href="#overview"><b>Casting Weekly</b><span>INDUSTRY</span></a>
    <nav class="nav" aria-label="Sections">
      <a href="#overview">Overview</a>
      <a href="#network">Network</a>
      <a href="#casting-directors">Casting directors</a>
      <a href="#productions">Productions</a>
      <a href="#people">People</a>
      <a href="#data-quality">Data quality</a>
      <a href="#about">About</a>
    </nav>
    <div class="cmd">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="Search people or productions" aria-label="Search people or productions" aria-controls="sugg">
      <kbd>/</kbd>
      <div class="sugg" id="sugg" role="listbox" hidden></div>
    </div>
  </div>
</header>

<main id="page" class="page gut"></main>

<section id="net" class="net" aria-label="Network" hidden>
  <aside class="rail" aria-label="Network controls">
    <p class="lbl">Centre on</p>
    <div class="toggles" id="centre" role="group" aria-label="Centre the network on"></div>
    <p class="lbl">Show · linked top to bottom</p>
    <p class="hint">Each row links to the next through shared productions. Drag ⠿ to reorder.</p>
    <div class="toggles chain" id="toggles"></div>
    <p class="lbl">Casting directors</p>
    <div class="index" id="cdindex"></div>
  </aside>
  <div class="stage" id="stage">
    <div class="hud">Click a node to open its file · drag · scroll to zoom</div>
    <label class="centre-pick">Centre on <select id="centreSel"><option value="cd">Casting directors</option><option value="prod">Productions</option><option value="theatre">Venues &amp; tours</option><option value="person">Creatives</option></select></label>
    <div class="zoom"><button id="zin" type="button" aria-label="Zoom in">+</button><button id="zout" type="button" aria-label="Zoom out">−</button><button id="zfit" type="button" aria-label="Fit to screen">⤢</button></div>
  </div>
  <aside class="dossier" id="dossier" aria-label="Quick view" aria-live="polite"></aside>
</section>

<script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"></script>
<script type="application/json" id="data">__DATA__</script>
<script>
(function(){
"use strict";
const RAW = JSON.parse(document.getElementById("data").textContent);

/* ---------- helpers ---------- */
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if(attrs) for(const [k, v] of Object.entries(attrs)){
    if(v == null || v === false) continue;
    if(k === "class") e.className = v; else if(k === "text") e.textContent = v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v);
  }
  for(const c of kids.flat(Infinity)){ if(c == null || c === false) continue; e.append(c.nodeType ? c : String(c)); }
  return e;
}
const slug = s => s.normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/&/g, " and ").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
const fmtDate = d => new Date(d + "T12:00:00Z").toLocaleDateString("en-GB", {day:"numeric", month:"short", year:"numeric"});
const domain = u => u.replace(/^https?:\/\/(www\.)?/, "").split("/")[0];
const plural = (n, one, many) => n + " " + (n === 1 ? one : (many || one + "s"));
const ROLES = ["Casting director", "Director", "Writer", "Composer", "Lyricist"];
const ROLE_PL = {"Casting director":"Casting directors", Director:"Directors", Writer:"Writers", Composer:"Composers", Lyricist:"Lyricists"};
const TYPES = ["London", "Touring", "Regional", "International", "Not stated"];
function venueType(v){
  if(!v || /not stated/i.test(v)) return "Not stated";
  if(/tour/i.test(v)) return "Touring";
  if(/london/i.test(v)) return "London";
  if(/new york|broadway/i.test(v)) return "International";
  return "Regional";
}
const venueName = v => /not stated/i.test(v) ? "Venue not stated" : v;

/* ---------- model ---------- */
const people = new Map(), prods = new Map(), venues = new Map(), used = new Set();
const uniq = s => { let k = s, i = 2; while(used.has(k)) k = s + "-" + i++; used.add(k); return k; };
for(const e of RAW.edges){
  let p = people.get(e.person);
  if(!p){ p = {name:e.person, kind:"person", credits:[], roles:new Set(), aka:new Set(), prods:new Set()}; people.set(e.person, p); }
  let r = prods.get(e.production);
  if(!r){ r = {label:e.production, show:e.show, venue:e.venue, type:venueType(e.venue), credits:[], urls:new Set(), batch:0}; prods.set(e.production, r); }
  let v = venues.get(e.venue);
  if(!v){ v = {name:e.venue, prods:new Set()}; venues.set(e.venue, v); }
  p.credits.push(e); p.roles.add(e.role); p.prods.add(r); if(e.credited_as) p.aka.add(e.credited_as);
  if(e.role === "Casting director") p.kind = "cd";
  r.credits.push(e); r.urls.add(e.url); r.batch = Math.max(r.batch, e.batch || 0); v.prods.add(r);
}
const PEOPLE = [...people.values()].sort((a, b) => a.name.localeCompare(b.name));
const PRODS = [...prods.values()].sort((a, b) => a.show.localeCompare(b.show) || a.venue.localeCompare(b.venue));
PEOPLE.forEach(p => p.hash = uniq("person-" + slug(p.name)));
PRODS.forEach(r => {
  r.hash = uniq("show-" + slug(r.label));
  r.team = {}; for(const role of ROLES) r.team[role] = [...new Set(r.credits.filter(c => c.role === role).map(c => c.person))].map(n => people.get(n));
});
const CDS = PEOPLE.filter(p => p.kind === "cd").sort((a, b) => b.prods.size - a.prods.size || a.name.localeCompare(b.name));
const NOCD = PRODS.filter(r => !r.team["Casting director"].length);
const SOURCES = new Set(RAW.edges.map(e => e.url));
const rank = q => q.kind === "cd" ? 0 : q.roles.has("Director") ? 1 : 2;
function collaborators(p){
  const m = new Map();
  for(const r of p.prods) for(const c of r.credits){ const q = people.get(c.person); if(q !== p){ if(!m.has(q)) m.set(q, new Set()); m.get(q).add(r); } }
  return [...m.entries()].map(([q, s]) => ({p:q, n:s.size})).sort((a, b) => rank(a.p) - rank(b.p) || b.n - a.n || a.p.name.localeCompare(b.p.name));
}
const byHash = new Map([...PEOPLE.map(p => [p.hash, p]), ...PRODS.map(r => [r.hash, r])]);

/* ---------- shared pieces ---------- */
const personLink = p => h("a", {class:"lnk" + (p.kind === "cd" ? " cd" : ""), href:"#" + p.hash}, p.name);
const showLink = r => h("a", {class:"lnk", href:"#" + r.hash}, r.show);
const joinLinks = list => list.length ? h("span", {class:"list-inline"}, list.map(personLink)) : null;
const castCell = r => r.team["Casting director"].length ? joinLinks(r.team["Casting director"]) : h("span", {class:"pill warn"}, "Not stated");
const writersOf = r => [...new Set(["Writer", "Composer", "Lyricist"].flatMap(k => r.team[k]))];
function head(title, sub, aside, crumb){
  return h("header", {class:"ph"}, h("div", null, crumb ? h("p", {class:"crumb"}, crumb) : null, h("h1", null, title), sub ? h("p", null, sub) : null), aside || null);
}
function card(title, body, more){
  return h("section", {class:"card"}, h("div", {class:"card-h"}, h("h2", {class:"sec"}, title), more || null), body);
}
function table(cols, rows, empty){
  if(!rows.length) return h("div", {class:"tbl"}, h("p", {class:"empty"}, empty || "Nothing to show."));
  return h("div", {class:"tbl"}, h("table", null,
    h("thead", null, h("tr", null, cols.map(c => h("th", {class: c.endsWith("#") ? "num" : null}, c.replace(/#$/, ""))))),
    h("tbody", null, rows.map(r => h("tr", null, r.map((c, i) => h("td", {class: cols[i].endsWith("#") ? "num" : null}, c)))))));
}
function creditCard(c, ctx){
  const r = prods.get(c.production), p = people.get(c.person);
  return h("article", {class:"cred"},
    h("div", {class:"cred-h"},
      h("span", {class:"role" + (c.role === "Casting director" ? " cd" : "")}, c.role),
      ctx === "person" ? showLink(r) : personLink(p),
      ctx === "person" ? h("span", {class:"muted"}, venueName(r.venue)) : null),
    h("blockquote", {class:"ev"}, "“" + c.evidence + "”"),
    h("div", {class:"prov"}, h("a", {href:c.url, target:"_blank", rel:"noopener"}, domain(c.url) + " ↗"),
      c.credited_as ? h("span", null, "Credited as " + c.credited_as) : null));
}
function seg(options, current, onPick){
  return h("div", {class:"seg", role:"group"}, options.map(([value, label, n]) =>
    h("button", {type:"button", "aria-pressed": String(value === current), onclick: () => onPick(value)}, label, n != null ? h("small", null, n) : null)));
}

const prodState = {type:"All", missing:false, q:""};
VIEWS.productions = () => {
  const wrap = h("div", {style:"display:contents"});
  const results = h("div");
  const counts = Object.fromEntries(TYPES.map(t => [t, PRODS.filter(r => r.type === t).length]));
  function draw(){
    const q = prodState.q.toLowerCase();
    const rows = PRODS.filter(r => (prodState.type === "All" || r.type === prodState.type) && (!prodState.missing || !r.team["Casting director"].length)
      && (!q || (r.show + " " + r.venue + " " + r.credits.map(c => c.person).join(" ")).toLowerCase().includes(q)));
    results.replaceChildren(
      table(["Production", "Venue", "Casting", "Director", "Writers", "Sources#"], rows.map(r => [
        showLink(r), h("span", null, venueName(r.venue), h("span", {class:"sub"}, r.type)), castCell(r),
        joinLinks(r.team.Director) || h("span", {class:"muted"}, "—"), joinLinks(writersOf(r)) || h("span", {class:"muted"}, "—"), r.urls.size]),
        "No productions match these filters."));

    seg([["All", "All", PRODS.length], ...TYPES.filter(t => counts[t]).map(t => [t, t, counts[t]])], prodState.type, v => { prodState.type = v; rebuildSeg(); draw(); }),

    h("input", {type:"search", id:"f-prod", placeholder:"Filter by title, venue or name", value: prodState.q, "aria-label":"Filter productions", oninput: e => { prodState.q = e.target.value; draw(); }}),
    h("span", {class:"count"}));

  wrap.append(head("Productions", "Every production on file with its creative team. Casting that no source states is marked."), controls, results);
  draw();
  return wrap;
};

/* ---------- routing ---------- */
const page = document.getElementById("page"), netEl = document.getElementById("net");
function route(){
  const key = decodeURIComponent(location.hash.slice(1)) || "overview";
  let render = VIEWS[key], nav = key;
  if(!render && byHash.has(key)){
    const x = byHash.get(key);
    if(key.startsWith("person-")){ render = () => personView(x); nav = x.kind === "cd" ? "casting-directors" : "people"; }
    else { render = () => showView(x); nav = "productions"; }
  }
  if(key === "network") render = null;
  else if(!render){ render = notFound; nav = ""; }
  document.querySelectorAll(".nav a").forEach(a => a.getAttribute("href") === "#" + nav ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  const isNet = key === "network";
  netEl.hidden = !isNet; page.hidden = isNet;
  if(isNet) Net.show();
  else { page.replaceChildren(...[].concat(render()).filter(Boolean)); window.scrollTo(0, 0); }
}
addEventListener("hashchange", route);

/* ---------- search ---------- */
const q = document.getElementById("q"), sugg = document.getElementById("sugg"); let active = 0, hits = [];
const SEARCH = [...PEOPLE.map(p => ({label:p.name, extra:[...p.aka].join(" "), kind:p.kind === "cd" ? "Casting director" : "Creative", color:p.kind === "cd" ? "var(--amber)" : "var(--person)", hash:p.hash, w:p.kind === "cd" ? 0 : 1})),
  ...PRODS.map(r => ({label:r.show, extra:r.venue, kind:venueName(r.venue).split(",")[0], color:"var(--cyan)", hash:r.hash, w:2}))];
function runSearch(){
  const t = q.value.toLowerCase().trim();
  hits = t ? SEARCH.filter(s => (s.label + " " + s.extra).toLowerCase().includes(t)).sort((a, b) => a.w - b.w || a.label.localeCompare(b.label)).slice(0, 8) : [];
  sugg.replaceChildren(...hits.map((s, i) => h("a", {href:"#" + s.hash, role:"option", "aria-selected": String(i === 0), onmousedown: e => e.preventDefault(), onclick: () => { q.value = ""; sugg.hidden = true; }},
    h("span", {class:"dot", style:"background:" + s.color}), s.label, h("small", null, s.kind))));
  sugg.hidden = !hits.length; active = 0;
}
q.addEventListener("input", runSearch);
q.addEventListener("keydown", e => {
  if(e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); active = (active + (e.key === "ArrowDown" ? 1 : -1) + hits.length) % Math.max(hits.length, 1); [...sugg.children].forEach((b, i) => b.setAttribute("aria-selected", String(i === active))); }
  if(e.key === "Enter" && hits[active]){ location.hash = hits[active].hash; q.value = ""; sugg.hidden = true; q.blur(); }
  if(e.key === "Escape"){ q.value = ""; runSearch(); q.blur(); }
});
q.addEventListener("blur", () => setTimeout(() => { sugg.hidden = true; }, 150));
addEventListener("keydown", e => { if(e.key === "/" && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); q.focus(); } });

/* ---------- network ---------- */
let pending = null;
function openInNetwork(id){ pending = id; if(location.hash === "#network") Net.show(); else location.hash = "network"; }
const Net = {started:false};
Net.show = function(){
  if(!Net.started){ Net.started = true; Net.init(); }
  requestAnimationFrame(() => { if(pending){ Net.select(pending); pending = null; } else Net.fit(0); });
};
Net.init = function(){
  const KIND = {cd:{label:"Casting director", color:"var(--amber)", pill:"cd"}, person:{label:"Creative", color:"var(--person)", pill:""},
                prod:{label:"Production", color:"var(--cyan)", pill:"prod"}, theatre:{label:"Venue or tour", color:"var(--violet)", pill:"venue"}};
  const ROW_NAME = {cd:"Casting directors", person:"Creatives", prod:"Productions", theatre:"Venues & tours"};
  const nodes = new Map();
  const node = (id, kind, label, ref) => { let n = nodes.get(id); if(!n){ n = {id, kind, label, ref, nbrs:new Set(), prods:new Set()}; nodes.set(id, n); } return n; };
  for(const r of PRODS){
    const pn = node("r:" + r.hash, "prod", r.show, r); pn.prods.add(pn.id);
    const tn = node("t:" + r.venue, "theatre", venueName(r.venue), venues.get(r.venue)); tn.prods.add(pn.id);
    pn.nbrs.add(tn.id); tn.nbrs.add(pn.id);
    pn.members = {cd:[], person:[], theatre:[tn], prod:[pn]};
    for(const p of new Set(r.credits.map(c => people.get(c.person)))){
      const n = node("p:" + p.hash, p.kind, p.name, p); n.prods.add(pn.id); n.nbrs.add(pn.id); pn.nbrs.add(n.id); pn.members[p.kind].push(n);
    }
  }
  const N = [...nodes.values()], PN = N.filter(n => n.kind === "prod");
  const count = k => N.filter(n => n.kind === k).length;
  const shares = (a, b) => { for(const id of a.prods) if(b.prods.has(id)) return true; return false; };
  const deg = n => n.kind === "prod" ? n.nbrs.size - 1 : n.prods.size;

  /* rail */
  const visible = {cd:true, person:true, prod:true, theatre:true};
  let ORDER = ["cd", "person", "prod", "theatre"];
  try { const o = JSON.parse(localStorage.getItem("cw-chain") || "null"); if(Array.isArray(o) && o.length === 4 && ORDER.every(k => o.includes(k))) ORDER = o; } catch(e) {}
  const tg = document.getElementById("toggles"), toggleBtn = {}, rowEl = {};
  for(const k of ORDER){
    const sw = h("i", {class:"sw" + (k === "prod" ? " sq" : ""), style:"background:" + KIND[k].color});
    const b = h("button", {type:"button", class:"tg", "aria-pressed":"true", onclick: () => { visible[k] = !visible[k]; b.setAttribute("aria-pressed", String(visible[k])); rewire(); }}, sw, ROW_NAME[k], h("small", null, count(k)));
    const grip = h("button", {type:"button", class:"grip", "aria-label":"Move " + ROW_NAME[k] + " in the chain (arrow keys)"}, "⠿");
    const row = h("div", {class:"row", "data-k":k}, grip, b);
    grip.addEventListener("keydown", e => {
      if(e.key !== "ArrowUp" && e.key !== "ArrowDown") return; e.preventDefault();
      const sib = e.key === "ArrowUp" ? row.previousElementSibling : row.nextElementSibling; if(!sib) return;
      e.key === "ArrowUp" ? tg.insertBefore(row, sib) : tg.insertBefore(sib, row); grip.focus(); commitOrder();
    });
    grip.addEventListener("pointerdown", e => {
      e.preventDefault(); row.classList.add("dragging");
      const move = ev => { const rows = [...tg.children].filter(r => r !== row); const after = rows.find(r => { const bb = r.getBoundingClientRect(); return ev.clientY < bb.top + bb.height / 2; }); after ? tg.insertBefore(row, after) : tg.append(row); };
      const up = () => { removeEventListener("pointermove", move); removeEventListener("pointerup", up); removeEventListener("pointercancel", up); row.classList.remove("dragging"); commitOrder(); };
      addEventListener("pointermove", move); addEventListener("pointerup", up); addEventListener("pointercancel", up);
    });
    tg.append(row); toggleBtn[k] = b; rowEl[k] = row;
  }
  function commitOrder(){
    const o = [...tg.children].map(r => r.dataset.k); if(o.join() === ORDER.join()) return;
    ORDER = o; try { localStorage.setItem("cw-chain", JSON.stringify(ORDER)); } catch(e) {}
    rewire();
  }
  const centreBox = document.getElementById("centre"), centreBtn = {};
  for(const k of ["cd", "prod", "theatre", "person"]){
    const b = h("button", {type:"button", class:"tg", "aria-pressed": String(k === "cd"), onclick: () => layout(k)}, h("i", {class:"sw" + (k === "prod" ? " sq" : ""), style:"background:" + KIND[k].color}), ROW_NAME[k]);
    centreBox.append(b); centreBtn[k] = b;
  }
  const idx = document.getElementById("cdindex");
  N.filter(n => n.kind === "cd").sort((a, b) => b.prods.size - a.prods.size || a.label.localeCompare(b.label))
    .forEach(n => idx.append(h("button", {type:"button", onclick: () => select(n, true)}, n.label, h("small", null, n.prods.size))));

  /* drawing */
  const stage = document.getElementById("stage");
  const W = () => stage.clientWidth, H = () => stage.clientHeight;
  const svg = d3.select(stage).append("svg").attr("role", "img").attr("aria-label", "Network of casting directors, creatives, productions and venues");
  const glow = svg.append("defs").append("filter").attr("id", "glow").attr("x", "-50%").attr("y", "-50%").attr("width", "200%").attr("height", "200%");
  glow.append("feGaussianBlur").attr("stdDeviation", "3").attr("result", "b");
  const fm = glow.append("feMerge"); fm.append("feMergeNode").attr("in", "b"); fm.append("feMergeNode").attr("in", "SourceGraphic");
  const root = svg.append("g");
  const zoom = d3.zoom().scaleExtent([.25, 4]).on("zoom", ev => root.attr("transform", ev.transform));
  svg.call(zoom).on("dblclick.zoom", null);
  const ring = root.append("g").attr("pointer-events", "none");
  const ringCircle = ring.append("circle").style("fill", "none").style("stroke", "var(--line2)").attr("stroke-dasharray", "3 6");
  const ringText = ring.append("text").attr("text-anchor", "middle").attr("class", "ring-text");
  const linkG = root.append("g");
  let L = linkG.selectAll("line"), shown = [];
  const HUB_MAX = {cd:40, prod:12, theatre:12, person:12};
  const RING_TEXT = {cd:"NO CASTING DIRECTOR STATED", prod:"NOT LINKED TO A LEADING PRODUCTION", theatre:"NOT LINKED TO A LEADING VENUE", person:"NOT LINKED TO A LEADING CREATIVE"};
  let HUBS = [];
  const size = n => n.hub ? 16 + Math.min(deg(n), 8) * 2.5 : n.kind === "prod" ? 7 : n.kind === "theatre" ? 6 : n.kind === "cd" ? 6 : 3.5;
  const G = root.append("g").selectAll("g").data(N).join("g").style("cursor", "pointer")
    .attr("tabindex", 0).attr("role", "button").attr("aria-label", n => KIND[n.kind].label + ": " + n.label)
    .on("click", (ev, n) => select(n, false)).on("keydown", (ev, n) => { if(ev.key === "Enter") select(n, false); });
  G.call(d3.drag().on("start", (ev, d) => { if(!ev.active) sim.alphaTarget(.25).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (ev, d) => { d.fx = ev.x; d.fy = ev.y; }).on("end", (ev, d) => { if(!ev.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
  const T = root.append("g").selectAll("text").data(N).join("text").attr("text-anchor", "middle").text(n => n.label.length > 34 ? n.label.slice(0, 32) + "…" : n.label);

  function chainLinks(){
    const rows = ORDER.filter(k => visible[k]), out = new Map();
    for(let i = 0; i + 1 < rows.length; i++){
      const A = rows[i], B = rows[i + 1];
      for(const p of PN) for(const a of p.members[A]) for(const b of p.members[B]){
        if(a === b) continue;
        const id = a.id + "|" + b.id; let l = out.get(id);
        if(!l) out.set(id, l = {key:id, source:a.id, target:b.id, n:0, kind: A === "theatre" || B === "theatre" ? "venue" : A === "cd" || B === "cd" ? "cd" : "credit"});
        l.n++;
      }
    }
    return [...out.values()];
  }
  function joinEdges(){
    for(const k of ORDER) rowEl[k].style.opacity = visible[k] ? "" : ".55";
    shown = chainLinks();
    L = linkG.selectAll("line").data(shown, d => d.key).join("line").attr("class", d => "l-" + d.kind)
      .attr("stroke-width", d => (d.kind === "venue" ? 1 : 1.3) + Math.min(d.n - 1, 3) * .6);
    sim.force("link").links(shown);
  }
  function draw(){
    G.selectAll("*").remove();
    G.each(function(n){
      const g = d3.select(this);
      if(n.hub){
        g.append("circle").attr("r", size(n) + 9).style("fill", "none").style("stroke", KIND[n.kind].color).attr("stroke-opacity", .35).attr("stroke-dasharray", "2 4");
        g.append("circle").attr("class", "core").attr("r", size(n)).style("fill", KIND[n.kind].color).attr("filter", "url(#glow)");
        g.append("text").attr("text-anchor", "middle").attr("dy", "0.35em").attr("style", "font:600 12px var(--mono);fill:var(--on-accent);pointer-events:none")
          .text(n.label.split(/\s+/).filter(w => /^[A-Za-z]/.test(w)).map(w => w[0]).join("").slice(0, 3).toUpperCase());
      }
      else if(n.kind === "prod") g.append("rect").attr("class", "core").attr("x", -size(n)).attr("y", -size(n)).attr("width", size(n) * 2).attr("height", size(n) * 2).attr("transform", "rotate(45)").style("fill", "var(--bg)").style("stroke", "var(--cyan)").attr("stroke-width", 1.6);
      else if(n.kind === "theatre") g.append("circle").attr("class", "core").attr("r", size(n)).style("fill", "var(--violet-soft)").style("stroke", "var(--violet)").attr("stroke-width", 1.6);
      else g.append("circle").attr("class", "core").attr("r", size(n)).style("fill", KIND[n.kind].color).attr("opacity", .9);
    });
    G.append("title").text(n => n.kind === "prod" ? n.label + " · " + venueName(n.ref.venue) : n.label);
    T.attr("class", n => "node-label" + (n.hub ? " hub" : n.kind === "prod" ? " prod" : "")).style("fill", n => n.hub ? KIND[n.kind].color : null)
     .attr("dy", n => n.hub ? size(n) + 26 : n.kind === "theatre" ? size(n) + 18 : -size(n) - 8);
  }
  const pull = n => n.hub ? .9 : n.loose ? .5 : n.tx != null ? .12 : 0;
  const sim = d3.forceSimulation(N)
    .force("link", d3.forceLink([]).id(d => d.id)).force("charge", d3.forceManyBody()).force("collide", d3.forceCollide())
    .force("x", d3.forceX(n => n.tx ?? 0)).force("y", d3.forceY(n => n.ty ?? 0))
    .on("tick", () => {
      L.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
      G.attr("transform", d => `translate(${d.x},${d.y})`); T.attr("x", d => d.x).attr("y", d => d.y);
    });
  function forces(){
    sim.force("link").distance(l => (l.source.hub || l.target.hub) ? 95 : l.kind === "venue" ? 60 : 38).strength(l => (l.source.hub || l.target.hub) ? .25 : .6);
    sim.force("charge").strength(n => n.hub ? -500 : n.kind === "prod" ? -160 : -40);
    sim.force("collide").radius(n => size(n) + (n.hub ? 22 : 10));
    sim.force("x").x(n => n.tx ?? 0).strength(pull); sim.force("y").y(n => n.ty ?? 0).strength(pull);
  }
  function layout(kind){
    visible[kind] = true; toggleBtn[kind].setAttribute("aria-pressed", "true");
    for(const k in centreBtn) centreBtn[k].setAttribute("aria-pressed", String(k === kind));
    document.getElementById("centreSel").value = kind;
    N.forEach(n => { n.hub = false; n.loose = false; n.tx = n.ty = null; });
    HUBS = N.filter(n => n.kind === kind && !/not stated/i.test(n.label)).sort((a, b) => deg(b) - deg(a) || a.label.localeCompare(b.label)).slice(0, HUB_MAX[kind]);
    HUBS.forEach(x => x.hub = true);
    const R_IN = HUBS.length > 1 ? Math.max(150, HUBS.length * 16) : 0, R_RING = R_IN + 260;
    HUBS.forEach((x, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / HUBS.length; x.tx = R_IN * Math.cos(a); x.ty = R_IN * Math.sin(a); });
    const loose = [];
    for(const n of N){
      if(n.hub) continue;
      const hs = HUBS.filter(x => shares(x, n));
      if(hs.length){
        const mx = d3.mean(hs, x => x.tx), my = d3.mean(hs, x => x.ty), d = Math.hypot(mx, my) || 1;
        n.tx = mx + (HUBS.length > 1 ? mx / d : 0) * 110; n.ty = my + (HUBS.length > 1 ? my / d : 1) * 110;
      } else if(n.kind === "prod" || n.kind === kind){ n.loose = true; loose.push(n); }
    }
    loose.forEach((p, i) => { const a = -Math.PI / 2 + (i + .5) * 2 * Math.PI / loose.length; p.tx = R_RING * Math.cos(a); p.ty = R_RING * Math.sin(a); });
    N.forEach(n => { if(n.tx != null){ n.x = n.tx + (Math.random() - .5) * 20; n.y = n.ty + (Math.random() - .5) * 20; } });
    ring.style("display", loose.length ? null : "none");
    ringCircle.attr("r", R_RING); ringText.attr("y", -R_RING - 14).text(RING_TEXT[kind]);
    joinEdges(); draw(); forces();
    selected = null; paint(); renderDossier();
    sim.alpha(1).restart();
    setTimeout(() => { if(!selected) fit(); }, 1400);
  }
  function rewire(){ joinEdges(); paint(); forces(); sim.alpha(.6).restart(); }
  sim.on("end", () => { if(!selected) fit(); });

  let selected = null;
  function focusSet(n){ const s = new Set([n.id]); n.nbrs.forEach(id => s.add(id)); if(n.kind !== "prod") n.nbrs.forEach(id => nodes.get(id).nbrs.forEach(x => s.add(x))); return s; }
  function paint(){
    const f = selected ? focusSet(selected) : null, show = n => visible[n.kind];
    G.style("display", n => show(n) ? null : "none").style("opacity", n => !f || f.has(n.id) ? 1 : .1);
    G.select(".core").style("stroke", n => n === selected ? "var(--text)" : n.kind === "prod" ? "var(--cyan)" : n.kind === "theatre" ? "var(--violet)" : null)
      .attr("stroke-width", n => n === selected ? 3 : (n.kind === "prod" || n.kind === "theatre") ? 1.6 : 0);
    L.style("display", l => show(l.source) && show(l.target) ? null : "none").style("opacity", l => !f || (f.has(l.source.id) && f.has(l.target.id)) ? 1 : .05);
    const few = f && f.size <= 45;
    T.style("display", n => show(n) && (n.hub || (few && f.has(n.id))) ? null : "none").style("opacity", n => !f || f.has(n.id) ? 1 : .25);
  }
  function fit(dur = 700){
    const vis = N.filter(n => visible[n.kind] && n.x != null); if(!vis.length || !W()) return;
    const xs = vis.map(n => n.x), ys = vis.map(n => n.y), pad = 70;
    const x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad, y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad;
    const k = Math.min(2, .95 * Math.min(W() / (x1 - x0), H() / (y1 - y0)));
    svg.transition().duration(dur).call(zoom.transform, d3.zoomIdentity.translate(W() / 2 - k * (x0 + x1) / 2, H() / 2 - k * (y0 + y1) / 2).scale(k));
  }
  function centreOn(n){ const k = Math.max(1.3, d3.zoomTransform(svg.node()).k); svg.transition().duration(650).call(zoom.transform, d3.zoomIdentity.translate(W() / 2 - k * n.x, H() / 2 - k * n.y).scale(k)); }
  document.getElementById("zin").onclick = () => svg.transition().call(zoom.scaleBy, 1.3);
  document.getElementById("zout").onclick = () => svg.transition().call(zoom.scaleBy, 1 / 1.3);
  document.getElementById("zfit").onclick = () => { selected = null; paint(); renderDossier(); fit(); };
  svg.on("click", ev => { if(ev.target === svg.node()){ selected = null; paint(); renderDossier(); } });

  /* quick view */
  const D = document.getElementById("dossier");
  function renderDossier(){
    D.replaceChildren();
    if(!selected){
      D.append(h("div", {class:"d-empty"}, h("p", {class:"lbl"}, "Quick view"), h("h2", null, "Select anyone in the network"),
        h("p", null, "See who they worked with, on what, and where. Every connection quotes the public page it comes from."),
        h("p", null, "Start with a casting director on the left, or press / to search.")));
      return;
    }
    const n = selected, ref = n.ref, k = KIND[n.kind];
    const headEl = h("div", {class:"d-head"}, h("div", {class:"chips"}, h("span", {class:"pill " + k.pill}, k.label)), h("h2", null, n.label));
    if(n.kind === "theatre"){
      D.append(headEl, h("div", {class:"d-sec"}, h("p", {class:"lbl"}, "Productions · " + ref.prods.size),
        h("ul", {class:"att"}, [...ref.prods].map(r => h("li", null, h("p", null, showLink(r), h("br"), h("small", null, r.team["Casting director"].length ? "Casting: " + r.team["Casting director"].map(p => p.name).join(", ") : "Casting not stated")))))));
      return;
    }
    headEl.append(h("a", {class:"btn", href:"#" + ref.hash}, n.kind === "prod" ? "Open production →" : "Open full profile →"));
    D.append(headEl);
    if(n.kind === "prod"){
      D.append(h("div", {class:"d-sec"}, h("p", {class:"lbl"}, venueName(ref.venue)),
        table(["Role", "Name"], ROLES.map(role => [role, joinLinks(ref.team[role]) || (role === "Casting director" ? h("span", {class:"pill warn"}, "Not stated") : h("span", {class:"muted"}, "—"))]))));
      return;
    }
    const coll = collaborators(ref);
    D.append(h("div", {class:"d-sec"}, h("p", {class:"lbl"}, ROLES.filter(r => ref.roles.has(r)).join(" · ")),
      h("div", {class:"assoc"}, coll.slice(0, 18).map(x => h("a", {href:"#" + x.p.hash, class: x.p.kind === "cd" ? "cd" : null}, x.p.name, x.n > 1 ? h("small", null, "×" + x.n) : null)))));
    D.append(h("div", {class:"d-sec"}, h("p", {class:"lbl"}, "Evidence · " + ref.credits.length), ref.credits.map(c => creditCard(c, "person"))));
  }
  function select(n, centre){ if(typeof n === "string") n = nodes.get(n); if(!n) return; selected = n; paint(); renderDossier(); if(centre !== false) centreOn(n); D.scrollTop = 0; }
  Net.select = id => select(id, true);
  Net.fit = fit;
  addEventListener("resize", () => { if(!netEl.hidden) fit(0); });
  document.getElementById("centreSel").addEventListener("change", e => layout(e.target.value));
  layout("cd");
};

route();
})();
