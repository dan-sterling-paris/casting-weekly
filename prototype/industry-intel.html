<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casting Weekly · Network</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Archivo:wght@800&display=swap">
<style>
/* Layout: full-screen console. Left rail = filters and index; centre = live network; right = subject dossier; bottom = status line. */
:root{
  --bg:#07090D; --bg2:#0C1016; --panel:#0F141B; --panel2:#141B24; --line:#1D2630; --line2:#2A3542;
  --text:#D8DFE8; --dim:#8693A3; --faint:#566273;
  --amber:#F5B83D; --cyan:#5CC8FF; --violet:#A99BFF; --person:#C9D3DF; --ok:#5DD39E;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --sans:"IBM Plex Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);overflow:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--amber);outline-offset:2px}
.app{display:grid;grid-template-columns:268px minmax(0,1fr) 380px;grid-template-rows:52px minmax(0,1fr) 30px;height:100vh}
/* top bar */
.top{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 16px;border-bottom:1px solid var(--line);background:linear-gradient(var(--bg2),var(--bg))}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.brand b{font:800 17px Archivo,sans-serif;letter-spacing:-.01em}
.brand span{font:500 11px var(--mono);letter-spacing:.18em;color:var(--amber)}
.cmd{position:relative;flex:1;max-width:560px}
.cmd input{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:8px 12px 8px 34px;font:13px var(--mono);letter-spacing:.02em}
.cmd input::placeholder{color:var(--faint)}
.cmd svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);stroke:var(--dim)}
.cmd kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:11px var(--mono);color:var(--faint);border:1px solid var(--line2);border-radius:4px;padding:1px 5px}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line2);border-radius:8px;overflow:hidden;z-index:10;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.sugg button{display:flex;width:100%;gap:10px;align-items:center;background:none;border:0;padding:9px 12px;text-align:left;cursor:pointer}
.sugg button[aria-selected="true"],.sugg button:hover{background:var(--panel2)}
.sugg small{margin-left:auto;font:11px var(--mono);color:var(--faint)}
.live{margin-left:auto;display:flex;align-items:center;gap:8px;font:11px var(--mono);letter-spacing:.12em;color:var(--dim);white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 2.4s infinite}
@keyframes pulse{50%{opacity:.35}}
/* rails */
.rail{border-right:1px solid var(--line);background:var(--bg2);overflow:auto;padding:16px 14px}
.dossier{border-left:1px solid var(--line);background:var(--bg2);overflow:auto}
.lbl{font:500 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px}
.metric b{display:block;font:600 22px var(--mono);font-variant-numeric:tabular-nums}
.metric span{font:10.5px var(--mono);letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.toggles{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
.tg{display:flex;align-items:center;gap:10px;background:none;border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer;text-align:left}
.tg[aria-pressed="false"]{opacity:.45}
.tg .sw{width:10px;height:10px;border-radius:50%}
.tg .sq{border-radius:2px;transform:rotate(45deg)}
.tg small{margin-left:auto;font:11px var(--mono);color:var(--dim)}
.index{display:flex;flex-direction:column}
.index button{display:flex;gap:8px;align-items:center;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 2px;text-align:left;cursor:pointer}
.index button:hover{color:#fff}
.index small{margin-left:auto;font:11px var(--mono);color:var(--faint)}
/* stage */
.stage{position:relative;overflow:hidden;background:
  radial-gradient(ellipse at 50% 45%, rgba(92,200,255,.05), transparent 60%),
  linear-gradient(var(--line) 1px, transparent 1px) 0 0/48px 48px,
  linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/48px 48px, var(--bg)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65))}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;left:14px;top:12px;font:11px var(--mono);letter-spacing:.1em;color:var(--faint);pointer-events:none;z-index:2}
.hud b{color:var(--dim);font-weight:500}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px;z-index:2}
.zoom button{width:30px;height:30px;background:var(--panel);border:1px solid var(--line2);border-radius:5px;cursor:pointer;font:14px var(--mono)}
.node-label{font:500 11px var(--mono);fill:var(--text);paint-order:stroke;stroke:var(--bg);stroke-width:3px;pointer-events:none}
.node-label.prod{fill:var(--cyan);font-size:10.5px}
.node-label.cd{fill:var(--amber);font:600 14px var(--sans);stroke-width:4px}
/* dossier */
.d-empty{padding:28px 22px;color:var(--dim)}
.d-empty h2{font:600 15px var(--sans);color:var(--text);margin:0 0 8px}
.d-head{padding:20px 22px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--bg2))}
.d-id{display:flex;justify-content:space-between;font:11px var(--mono);letter-spacing:.14em;color:var(--faint)}
.d-head h2{font:600 24px/1.15 var(--sans);letter-spacing:-.01em;margin:10px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:3px;border:1px solid var(--line2);color:var(--dim)}
.chip.amber{border-color:rgba(245,184,61,.5);color:var(--amber)}
.chip.cyan{border-color:rgba(92,200,255,.45);color:var(--cyan)}
.chip.violet{border-color:rgba(169,155,255,.45);color:var(--violet)}
.chip.ok{border-color:rgba(93,211,158,.45);color:var(--ok)}
.d-stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.d-stats div{padding:12px 14px;border-right:1px solid var(--line)}
.d-stats div:last-child{border-right:0}
.d-stats b{display:block;font:600 20px var(--mono)}
.d-stats span{font:10px var(--mono);letter-spacing:.12em;color:var(--faint);text-transform:uppercase}
.d-sec{padding:16px 22px;border-bottom:1px solid var(--line)}
.assoc{display:flex;flex-wrap:wrap;gap:6px}
.assoc button{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 9px;cursor:pointer;font-size:13px}
.assoc button:hover{border-color:var(--line2);color:#fff}
.assoc small{font:11px var(--mono);color:var(--faint);margin-left:4px}
.cred{padding:12px 0;border-bottom:1px dashed var(--line)}
.cred:last-child{border-bottom:0}
.cred .r{font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
.cred .r.other{color:var(--dim)}
.cred h4{margin:3px 0 6px;font:600 14px var(--sans)}
.cred h4 button{all:unset;cursor:pointer}
.cred h4 button:hover{text-decoration:underline}
.ev{font:12px/1.55 var(--mono);color:#AEB9C6;background:var(--bg);border:1px solid var(--line);border-left:2px solid var(--amber);border-radius:4px;padding:8px 10px;overflow-wrap:anywhere}
.prov{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font:11px var(--mono);color:var(--faint)}
.prov a{color:var(--cyan);text-decoration:none;overflow-wrap:anywhere}
.prov a:hover{text-decoration:underline}
.prov .v{color:var(--ok)}
/* status */
.status{grid-column:1/-1;display:flex;gap:22px;align-items:center;padding:0 16px;border-top:1px solid var(--line);background:var(--bg2);font:10.5px var(--mono);letter-spacing:.12em;color:var(--faint);white-space:nowrap;overflow:hidden}
.status b{color:var(--dim);font-weight:500}
.centre-pick{display:none;position:absolute;left:14px;bottom:14px;z-index:2;font:12px var(--mono);color:var(--dim);background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;gap:6px;align-items:center}
.centre-pick select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 6px}
@media (max-width:1100px){.app{grid-template-columns:0 minmax(0,1fr) 340px}.rail{display:none}.centre-pick{display:flex}}
@media (max-width:760px){
  body{overflow:auto}.app{display:flex;flex-direction:column;height:auto}
  .stage{height:62vh}.dossier{border-left:0;border-top:1px solid var(--line)}.live{display:none}.status{flex-wrap:wrap;padding:8px 16px;gap:6px 16px}
}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
</style>
</head>

<div class="app">
  <header class="top">
    <div class="brand"><b>Casting Weekly</b><span>NETWORK</span></div>
    <div class="cmd">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="Search people, productions, theatres" aria-label="Search the network" aria-controls="sugg">
      <kbd>/</kbd>
      <div class="sugg" id="sugg" role="listbox" hidden></div>
    </div>
    <div class="live"><i></i>SOURCES VERIFIED · <span id="swept"></span></div>
  </header>

  <aside class="rail" aria-label="Overview and filters">

    <div class="metrics">
      <div class="metric"><b id="m-people">0</b><span>People</span></div>
      <div class="metric"><b id="m-cds">0</b><span>Casting dirs</span></div>
      <div class="metric"><b id="m-prods">0</b><span>Productions</span></div>

    <p class="lbl">Centre on</p>
    <div class="toggles" id="centre" role="group" aria-label="Centre the network on"></div>
    <p class="lbl">Show</p>
    <div class="toggles" id="toggles"></div>
    <p class="lbl">Casting directors</p>
    <div class="index" id="cdindex"></div>
  </aside>

  <main class="stage" id="stage" aria-label="Network graph">
    <div class="hud"><b id="hudMethod">LIVE NETWORK · NO AI</b> · CLICK A NODE TO OPEN ITS FILE · DRAG · SCROLL TO ZOOM</div>
    <label class="centre-pick">Centre on <select id="centreSel"><option value="cd">Casting directors</option><option value="prod">Productions</option><option value="theatre">Producers &amp; venues</option><option value="person">Creatives</option></select></label>
    <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Fit to screen">⤢</button></div>
  </main>

  <aside class="dossier" id="dossier" aria-label="File" aria-live="polite"></aside>

  <footer class="status" id="status"></footer>
</div>

});

/* ---- render ---- */
const stage = document.getElementById("stage");
const W = () => stage.clientWidth, H = () => stage.clientHeight;
const svg = d3.select(stage).append("svg").attr("role","img").attr("aria-label","Network of people, productions and theatres");
const defs = svg.append("defs");
const glow = defs.append("filter").attr("id","glow").attr("x","-50%").attr("y","-50%").attr("width","200%").attr("height","200%");
glow.append("feGaussianBlur").attr("stdDeviation","3.2").attr("result","b");
const fm = glow.append("feMerge"); fm.append("feMergeNode").attr("in","b"); fm.append("feMergeNode").attr("in","SourceGraphic");
const root = svg.append("g");
const zoom = d3.zoom().scaleExtent([.25,4]).on("zoom", ev => root.attr("transform", ev.transform));
svg.call(zoom).on("dblclick.zoom", null);

const L = root.append("g").selectAll("line").data(links).join("line")
  .attr("stroke", d => d.kind === "venue" ? "rgba(169,155,255,.18)" : d.role === "Casting director" ? "rgba(245,184,61,.35)" : "rgba(201,211,223,.16)")
  .attr("stroke-width", d => d.kind === "venue" ? 1 : 1.3).attr("stroke-dasharray", d => d.kind === "venue" ? "3 4" : null);
const HUB_MAX = {cd: 40, prod: 12, theatre: 12, person: 12};
const RING_TEXT = {cd: "CASTING DIRECTOR NOT STATED ON THE SOURCES READ", prod: "NOT LINKED TO A LEADING PRODUCTION",
                   theatre: "NOT LINKED TO A LEADING PRODUCER OR VENUE", person: "NOT LINKED TO A LEADING CREATIVE"};
let CENTRE = "cd", HUBS = [], R_IN = 150, R_RING = 400;
const deg = n => n.nbrs.size;
const size = n => n.hub ? 16 + Math.min(deg(n), 8) * 2.5 : n.kind === "prod" ? 7 : n.kind === "theatre" ? 6 : n.kind === "cd" ? 6 : 3.5;
const G = root.append("g").selectAll("g").data(N).join("g").attr("class","n").style("cursor","pointer")
  .attr("tabindex", 0).attr("role","button").attr("aria-label", n => KIND[n.kind].label + ": " + n.label)
  .on("click", (ev,n) => select(n)).on("keydown", (ev,n) => { if(ev.key === "Enter") select(n); });
G.call(d3.drag().on("start",(ev,d)=>{ if(!ev.active) sim.alphaTarget(.25).restart(); d.fx=d.x; d.fy=d.y; })
  .on("drag",(ev,d)=>{ d.fx=ev.x; d.fy=ev.y; }).on("end",(ev,d)=>{ if(!ev.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));
const T = root.append("g").selectAll("text").data(N).join("text").attr("text-anchor","middle").text(n => n.label.length > 34 ? n.label.slice(0,32) + "…" : n.label);
function draw(){
  G.selectAll("*").remove();
  G.each(function(n){
    const g = d3.select(this);
    if(n.hub){
      g.append("circle").attr("r", size(n) + 9).attr("fill","none").attr("stroke", KIND[n.kind].color).attr("stroke-opacity",.35).attr("stroke-width",1).attr("stroke-dasharray","2 4");
      g.append("circle").attr("class","core").attr("r",size(n)).attr("fill", KIND[n.kind].color).attr("filter","url(#glow)");
      g.append("text").attr("text-anchor","middle").attr("dy","0.35em").attr("style","font:600 12px var(--mono);fill:#121317;pointer-events:none").text(n.label.split(/\s+/).filter(w=>/^[A-Za-z]/.test(w)).map(w=>w[0]).join("").slice(0,3).toUpperCase());
    }
    else if(n.kind === "prod") g.append("rect").attr("x",-size(n)).attr("y",-size(n)).attr("width",size(n)*2).attr("height",size(n)*2).attr("transform","rotate(45)").attr("fill","var(--bg)").attr("stroke","var(--cyan)").attr("stroke-width",1.6);
    else if(n.kind === "theatre") g.append("circle").attr("r",size(n)).attr("fill","rgba(169,155,255,.12)").attr("stroke","var(--violet)").attr("stroke-width",1.6);
    else g.append("circle").attr("r",size(n)).attr("fill", KIND[n.kind].color).attr("opacity",.85);
  });
  G.append("title").text(n => n.label);   // hover any dot to see its name
  T.attr("class", n => "node-label" + (n.hub ? " cd" : n.kind==="prod" ? " prod" : "")).style("fill", n => n.hub ? KIND[n.kind].color : null)
   .attr("dy", n => n.hub ? size(n) + 26 : n.kind === "theatre" ? size(n) + 18 : -size(n) - 8);
}
const pull = n => n.hub ? .9 : n.loose ? .5 : n.tx != null ? .12 : 0;
const sim = d3.forceSimulation(N)
  .force("link", d3.forceLink(links).id(d=>d.id))
  .force("charge", d3.forceManyBody())
  .force("collide", d3.forceCollide())
  .force("x", d3.forceX(n => n.tx ?? 0)).force("y", d3.forceY(n => n.ty ?? 0))
  .on("tick", () => {
    L.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
    G.attr("transform", d => `translate(${d.x},${d.y})`); T.attr("x",d=>d.x).attr("y",d=>d.y);
  });
const ring = root.insert("g", ":first-child").attr("pointer-events","none");
const ringCircle = ring.append("circle").attr("fill","none").attr("stroke","rgba(255,255,255,.07)").attr("stroke-dasharray","3 6");
const ringText = ring.append("text").attr("text-anchor","middle").attr("style","font:500 11px var(--mono);letter-spacing:.14em;fill:var(--faint)");

function layout(kind){
  CENTRE = kind;
  visible[kind] = true; toggleBtn[kind].setAttribute("aria-pressed","true");
  for(const k in centreBtn) centreBtn[k].setAttribute("aria-pressed", String(k === kind));
  document.getElementById("centreSel").value = kind;
  N.forEach(n => { n.hub = false; n.loose = false; n.tx = n.ty = null; });
  HUBS = N.filter(n=>n.kind===kind && !/ not stated$/.test(n.label)).sort((a,b)=>deg(b)-deg(a) || a.label.localeCompare(b.label)).slice(0, HUB_MAX[kind]);
  HUBS.forEach(h => h.hub = true);
  R_IN = HUBS.length > 1 ? Math.max(150, HUBS.length * 16) : 0; R_RING = R_IN + 260;
  HUBS.forEach((h,i) => { const a = -Math.PI/2 + i*2*Math.PI/HUBS.length; h.tx = R_IN*Math.cos(a); h.ty = R_IN*Math.sin(a); });
  const hubSet = new Set(HUBS), loose = [];
  for(const n of N){
    if(n.hub) continue;
    const hs = [...n.nbrs].map(id=>nodes.get(id)).filter(x=>hubSet.has(x));
    if(hs.length){
      const mx = d3.mean(hs,h=>h.tx), my = d3.mean(hs,h=>h.ty), d = Math.hypot(mx,my) || 1;
      n.tx = mx + (HUBS.length > 1 ? mx/d : 0) * 110; n.ty = my + (HUBS.length > 1 ? my/d : 1) * 110;
    } else if(n.kind === "prod" || n.kind === kind){ n.loose = true; loose.push(n); }
  }
  loose.forEach((p,i) => { const a = -Math.PI/2 + (i+.5)*2*Math.PI/loose.length; p.tx = R_RING*Math.cos(a); p.ty = R_RING*Math.sin(a); });
  N.forEach(n => { if(n.tx != null){ n.x = n.tx + (Math.random()-.5)*20; n.y = n.ty + (Math.random()-.5)*20; } });
  ring.style("display", loose.length ? null : "none");
  ringCircle.attr("r", R_RING); ringText.attr("y", -R_RING - 14).text(RING_TEXT[kind]);
  draw();
  sim.force("link").distance(l => (l.source.hub || l.target.hub) ? 95 : l.kind === "venue" ? 60 : 38).strength(l => (l.source.hub || l.target.hub) ? .25 : .6);
  sim.force("charge").strength(n => n.hub ? -500 : n.kind === "prod" ? -160 : -40);
  sim.force("collide").radius(n => size(n) + (n.hub ? 22 : 10));
  sim.force("x").x(n => n.tx ?? 0).strength(pull); sim.force("y").y(n => n.ty ?? 0).strength(pull);
  selected = null; paint(); renderDossier();
  sim.alpha(1).restart();
  setTimeout(() => { fit(); if(HUBS[0]) select(HUBS[0]); }, 1400);
}
sim.on("end", () => { if(!selected) fit(); });

let selected = null;
function focusSet(n){ const s = new Set([n.id]); n.nbrs.forEach(id => s.add(id)); if(n.kind !== "prod"){ n.nbrs.forEach(id => nodes.get(id).nbrs.forEach(x => { s.add(x); })); } return s; }
function paint(){
  const f = selected ? focusSet(selected) : null;
  const show = n => visible[n.kind];
  G.style("display", n => show(n) ? null : "none").style("opacity", n => !f || f.has(n.id) ? 1 : .1);
  G.select(".core,rect,circle:not(.core)").filter(function(){ return !this.getAttribute("stroke-dasharray"); })
   .attr("stroke-width", n => n === selected ? 3 : (n.kind==="prod"||n.kind==="theatre") ? 1.6 : 0).attr("stroke", n => n === selected ? "#fff" : (n.kind==="prod" ? "var(--cyan)" : n.kind==="theatre" ? "var(--violet)" : null));
  L.style("display", l => show(l.source) && show(l.target) ? null : "none").style("opacity", l => !f || (f.has(l.source.id) && f.has(l.target.id)) ? 1 : .05);
  const few = f && f.size <= 45;   // name the neighbourhood only when it is small enough to read
  T.style("display", n => show(n) && (n.hub || (few && f.has(n.id))) ? null : "none")
   .style("opacity", n => !f || f.has(n.id) ? 1 : .25);
}
function fit(dur=700){
  const vis = N.filter(n => visible[n.kind] && n.x != null); if(!vis.length) return;
  const xs = vis.map(n=>n.x), ys = vis.map(n=>n.y), pad = 70;
  const x0 = Math.min(...xs)-pad, x1 = Math.max(...xs)+pad, y0 = Math.min(...ys)-pad, y1 = Math.max(...ys)+pad;
  const k = Math.min(2, .95 * Math.min(W()/(x1-x0), H()/(y1-y0)));
  svg.transition().duration(dur).call(zoom.transform, d3.zoomIdentity.translate(W()/2 - k*(x0+x1)/2, H()/2 - k*(y0+y1)/2).scale(k));
}
function centreOn(n){ const k = Math.max(1.3, d3.zoomTransform(svg.node()).k); svg.transition().duration(650).call(zoom.transform, d3.zoomIdentity.translate(W()/2 - k*n.x, H()/2 - k*n.y).scale(k)); }
document.getElementById("zin").onclick = () => svg.transition().call(zoom.scaleBy, 1.3);
document.getElementById("zout").onclick = () => svg.transition().call(zoom.scaleBy, 1/1.3);
document.getElementById("zfit").onclick = () => { selected = null; paint(); renderDossier(); fit(); };
svg.on("click", ev => { if(ev.target === svg.node()){ selected = null; paint(); renderDossier(); } });

/* ---- dossier ---- */
const D = document.getElementById("dossier");
function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
function renderDossier(){
  D.replaceChildren();
  if(!selected){
    const w = el("div","d-empty");
    w.append(el("p","lbl","File"), el("h2",null,"Select anyone in the network"),
      el("p",null,"Each file shows who a person has worked with, on what, and where. Every connection quotes the sentence it comes from on a public page, with a link to check it."),
      el("p",null,"Start with a casting director in the left column, or press / to search."));
    D.append(w); return;
  }
  const n = selected, k = KIND[n.kind];
  const head = el("div","d-head");
  const id = el("div","d-id"); id.append(el("span",null,"FILE " + n.ref), el("span",null,"VERIFIED · " + RAW.swept)); head.append(id);
  head.append(el("h2",null,n.label));
  const chips = el("div","chips"); chips.append(el("span","chip " + k.chip, k.label));
  const roles = [...new Set(n.credits.map(c=>c.role).filter(Boolean))]; if(n.kind==="person"||n.kind==="cd") roles.forEach(r => r !== "Casting director" && chips.append(el("span","chip", r)));
  if(n.theatre) chips.append(el("span","chip violet", n.theatre));
  chips.append(el("span","chip ok","Source-quoted")); head.append(chips); D.append(head);

  const prods = n.kind === "theatre" ? n.credits : [...new Set([...n.nbrs].map(i=>nodes.get(i)).filter(x=>x.kind==="prod"))];
  const rank = q => q.kind === "cd" ? 0 : q.credits.some(c => c.role === "Director") ? 1 : 2;
  const assoc = n.kind === "theatre" ? [] : associates(n).sort((a,b) => rank(a) - rank(b) || (b._shared||0) - (a._shared||0));
  const theatres = n.kind === "prod" ? [n.theatre] : [...new Set(prods.map(p=>p.theatre).filter(Boolean))];
  const st = el("div","d-stats");
  [[n.kind==="prod" ? n.credits.length : n.kind==="theatre" ? prods.length : n.credits.length, n.kind==="theatre" ? "Productions" : "Credits"],
   [n.kind==="theatre" ? new Set(prods.flatMap(p=>p.credits.map(c=>c.person))).size : assoc.length, n.kind==="theatre" ? "People" : "Associates"],
   [theatres.length, "Organisations"]].forEach(([v,l]) => { const d = el("div"); d.append(el("b",null,String(v)), el("span",null,l)); st.append(d); });
  D.append(st);

  if(assoc.length){
    const s = el("div","d-sec"); s.append(el("p","lbl", n.kind === "prod" ? "Credited people" : n.kind === "cd" ? "Worked with · directors first" : "Known associates · worked together"));
    const a = el("div","assoc");
    assoc.slice(0,24).forEach(q => { const b = el("button"); b.type = "button"; b.style.borderColor = q.kind==="cd" ? "rgba(245,184,61,.45)" : ""; b.append(q.label); if(q._shared > 1) b.append(el("small",null,"×"+q._shared)); b.onclick = () => select(q, true); a.append(b); });
    s.append(a);
    if(n.kind === "cd"){
      const orgs = [...new Set(prods.map(p=>p.theatre).filter(Boolean))];
      if(orgs.length){ s.append(el("p","lbl","Producers & venues")); const o = el("div","assoc"); orgs.forEach(t => o.append(el("span","chip violet",t))); s.append(o); }
    }
    D.append(s);
  }
  const conf = n.credits.find(c => c.identity === "confirmed by own site");
  if(conf && n.kind !== "prod" && n.kind !== "theatre"){
    const idb = el("div","d-sec"); idb.append(el("p","lbl","Identity"));
    const ch = el("div","chips"); ch.append(el("span","chip ok","Confirmed by own site")); idb.append(ch);
    idb.append(el("p",null,"Their own website also names " + conf.production + ":"));
    const full = conf.identityEvidence || "", at = full.toLowerCase().indexOf(conf.production.toLowerCase());
    const ex = at < 0 ? full : (at > 80 ? "…" : "") + full.slice(Math.max(0, at - 80), at + conf.production.length + 60) + (at + conf.production.length + 60 < full.length ? "…" : "");
    idb.append(el("div","ev", "“" + ex + "”"), el("div","prov", "debbieobrien.net · own credits list · rule ID1 (same title on own site)")); D.append(idb);
  }
  if(n.kind === "prod" && !n.cds.length){
    const nb = el("div","d-sec"); nb.append(el("p","lbl","Casting director"));
    nb.append(el("p",null,"Casting director not stated on the sources read. It will appear here only when a source names them."));
    D.append(nb);
  }
  if(n.kind === "prod" && n.credits[0] && n.credits[0].producerEvidence){
    const pb = el("div","d-sec"); pb.append(el("p","lbl","Producer · rule " + n.credits[0].producerRule));
    pb.append(el("div","ev", "“" + n.credits[0].producerEvidence + "”")); D.append(pb);
  }
  const s = el("div","d-sec"); s.append(el("p","lbl", n.kind === "theatre" ? "Productions on file" : "Evidence"));
  const list = (n.kind === "theatre" ? prods.flatMap(p => p.credits) : n.credits).slice()
    .sort((a,b) => n.kind === "cd" ? a.production.localeCompare(b.production) || String(b.year||"").localeCompare(String(a.year||"")) : 0);
  list.forEach(c => {
    const box = el("div","cred");
    box.append(el("div","r" + (c.role === "Casting director" ? "" : " other"), (c.roleAsStated || c.role) + (c.year ? " · " + c.year : "")));
    const h4 = el("h4"); const btn = el("button", null, n.kind === "prod" ? c.person : c.production);
    btn.onclick = () => select(nodes.get(n.kind === "prod" ? "p:"+c.person.toLowerCase() : "r:"+c.production.toLowerCase()), true);
    h4.append(btn); if(n.kind === "theatre") h4.append(" — " + c.person);
    box.append(h4, el("div","ev","“" + c.evidence + "”"));
    const pv = el("div","prov"); const a = el("a",null,c.url.replace(/^https?:\/\/(www\.)?/,"")); a.href = c.url; a.target = "_blank"; a.rel = "noopener";
    pv.append(a, el("span","v","✓ on page · " + RAW.swept));
    if(c.rule === "K") pv.append(el("span",null,"FOUND BY CLAUDE LOOKUP · NAME CHECKED ON PAGE BY SCRIPT"));
    else if(c.rule) pv.append(el("span",null,"RULE " + c.rule + " · NO AI"));
    if(c.sha) pv.append(el("span",null,"PAGE HASH " + c.sha));
    box.append(pv); s.append(box);
  });
  D.append(s);
}
function select(n, centre){ if(!n) return; selected = n; paint(); renderDossier(); if(centre) centreOn(n); D.scrollTop = 0; }

/* ---- search ---- */
const q = document.getElementById("q"), sugg = document.getElementById("sugg"); let active = 0, hits = [];
function runSearch(){
  const t = q.value.toLowerCase().trim();
  hits = t ? N.filter(n => n.label.toLowerCase().includes(t)).sort((a,b) => (a.kind==="cd"?0:1)-(b.kind==="cd"?0:1) || a.label.localeCompare(b.label)).slice(0,8) : [];
  sugg.replaceChildren(); sugg.hidden = !hits.length; active = 0;
  hits.forEach((n,i) => { const b = el("button"); b.type = "button"; b.setAttribute("role","option"); b.setAttribute("aria-selected", i===0);
    const sw = el("i"); sw.style.cssText = "width:8px;height:8px;border-radius:50%;background:" + KIND[n.kind].color; b.append(sw, n.label, el("small",null,KIND[n.kind].label));
    b.onmousedown = e => { e.preventDefault(); pick(n); }; sugg.append(b); });
  G.style("opacity", n => !t || n.label.toLowerCase().includes(t) ? 1 : .12);
}
function pick(n){ q.value = ""; sugg.hidden = true; select(n, true); }
q.addEventListener("input", runSearch);
q.addEventListener("keydown", e => {
  if(e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); active = (active + (e.key==="ArrowDown"?1:-1) + hits.length) % Math.max(hits.length,1); [...sugg.children].forEach((b,i)=>b.setAttribute("aria-selected", i===active)); }
  if(e.key === "Enter" && hits[active]) pick(hits[active]);
  if(e.key === "Escape"){ q.value = ""; runSearch(); q.blur(); }
});
q.addEventListener("blur", () => setTimeout(() => { sugg.hidden = true; if(!q.value) paint(); }, 120));
addEventListener("keydown", e => { if(e.key === "/" && document.activeElement !== q){ e.preventDefault(); q.focus(); } });
addEventListener("resize", () => fit(0));

paint(); renderDossier();
document.getElementById("centreSel").addEventListener("change", e => layout(e.target.value));
layout("cd");
})();
</script>
</body>
